name: Maya APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Maya APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Maya project ZIP
        shell: bash
        run: |
          if [ ! -f "MayaAndroidProject.zip" ]; then
            echo "ERROR: MayaAndroidProject.zip is missing."
            exit 1
          fi
          echo "Maya project ZIP found."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Maya project
        shell: bash
        run: |
          mkdir -p maya-source
          unzip -o MayaAndroidProject.zip -d maya-source

      # --- NEW FIX STEP START ---
      - name: Fix Java Version Mismatch
        shell: bash
        run: |
          echo "Patching build.gradle to match Java 17 environment..."
          # Find build.gradle files and replace version 1.8 with 17
          find maya-source -name "build.gradle" -print0 | xargs -0 sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g'
          # Also update Kotlin jvmTarget if it is explicitly set to 1.8
          find maya-source -name "build.gradle" -print0 | xargs -0 sed -i "s/jvmTarget = ['\"]1.8['\"]/jvmTarget = '17'/g"
      # --- NEW FIX STEP END ---

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""
          for FILE in settings.gradle.kts settings.gradle; do
            PROJECT_DIR="$(find maya-source -type f -name "$FILE" -print -quit)"
            if [ -n "$PROJECT_DIR" ]; then
              PROJECT_DIR="$(dirname "$PROJECT_DIR")"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found."
            echo "The ZIP must contain a complete Android project."
            find maya-source -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Build Maya debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload Maya APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-debug-APK
          path: |
            maya-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
