name: Maya APK Builder

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Maya APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Maya ZIP
        run: |
          if [ ! -f "MayaAndroidProject.zip" ]; then
            echo "ERROR: MayaAndroidProject.zip is missing."
            echo "Upload the Android project ZIP to the repository root."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Maya project
        run: |
          unzip -o MayaAndroidProject.zip -d maya-source

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find maya-source -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find maya-source -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $PROJECT_DIR"

      - name: Build Maya APK
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload Maya APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-debug-APK
          path: maya-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
