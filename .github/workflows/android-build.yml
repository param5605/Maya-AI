name: Maya APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Maya APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Maya ZIP
        shell: bash
        run: |
          echo "Checking repository files..."
          ls -la

          if [ ! -f "MayaAndroidProject.zip" ]; then
            echo "ERROR: MayaAndroidProject.zip is missing!"
            echo "Upload the Android project ZIP to the repository root."
            exit 1
          fi

          echo "Maya project ZIP found."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Maya project
        shell: bash
        run: |
          mkdir -p maya-source
          unzip -o MayaAndroidProject.zip -d maya-source

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find maya-source -name settings.gradle.kts -printf '%h\n' -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find maya-source -name settings.gradle -printf '%h\n' -quit)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find maya-source -name build.gradle.kts -printf '%h\n' -quit)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find maya-source -name build.gradle -printf '%h\n' -quit)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle Android project was found."
            echo "Check that the ZIP contains the Android project files."
            find maya-source -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Maya debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload Maya APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-debug-APK
          path: maya-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
