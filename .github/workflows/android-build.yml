name: Maya APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Maya APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Maya project ZIP
        shell: bash
        run: |
          if [ ! -f "MayaAndroidProject.zip" ]; then
            echo "ERROR: MayaAndroidProject.zip is missing."
            exit 1
          fi
          echo "Maya project ZIP found."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Maya project
        shell: bash
        run: |
          mkdir -p maya-source
          unzip -o MayaAndroidProject.zip -d maya-source

      # --- NEW: MAGIC PATCH TO FIX CODE TYPOS ---
      - name: Fix Int-to-Float Errors
        shell: bash
        run: |
          echo "Patching MainActivity.kt lines 78, 86, 109..."
          # This command finds the first number on these specific lines and adds 'f' to it
          # Example: Converts '10' to '10f'
          find maya-source -name "MainActivity.kt" -exec sed -i '78s/[0-9]\+/&f/' {} +
          find maya-source -name "MainActivity.kt" -exec sed -i '86s/[0-9]\+/&f/' {} +
          find maya-source -name "MainActivity.kt" -exec sed -i '109s/[0-9]\+/&f/' {} +
      # ------------------------------------------

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""
          for FILE in settings.gradle.kts settings.gradle; do
            PROJECT_DIR="$(find maya-source -type f -name "$FILE" -print -quit)"
            if [ -n "$PROJECT_DIR" ]; then
              PROJECT_DIR="$(dirname "$PROJECT_DIR")"
              break
            fi
          done
          
          if [ -z "$PROJECT_DIR" ]; then
             PROJECT_DIR="maya-source"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Create Override Script
        shell: bash
        run: |
          cat <<EOF > init.gradle
          import org.gradle.api.JavaVersion
          
          allprojects {
              afterEvaluate { project ->
                  project.tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }
                  def android = project.extensions.findByName("android")
                  if (android != null) {
                      android.compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                      project.dependencies {
                          add("implementation", "androidx.core:core-ktx:1.12.0")
                          add("implementation", "androidx.appcompat:appcompat:1.6.1")
                          add("implementation", "com.google.android.material:material:1.11.0")
                      }
                  }
              }
          }
          EOF

      - name: Build Maya debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          mv init.gradle "$PROJECT_DIR/"
          cd "$PROJECT_DIR"
          
          ARGS="--no-daemon --init-script init.gradle assembleDebug"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew $ARGS
          else
            gradle $ARGS
          fi

      - name: Upload Maya APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-debug-APK
          path: |
            maya-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
