name: Maya APK Builder

on: [workflow_dispatch]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check Maya ZIP
    run: |
      ls -la
      test -f MayaAndroidProject.zip || { echo "MayaAndroidProject.zip is missing"; exit 1; }

  - name: Set up Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android SDK licenses
    run: yes | sdkmanager --licenses

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Maya project
    run: unzip -o MayaAndroidProject.zip -d maya-source

  - name: Find Android project
    id: project
    shell: bash
    run: |
      PROJECT_DIR=$(find maya-source -name settings.gradle.kts -printf '%h\n' | head -n 1)
      if [ -z "$PROJECT_DIR" ]; then
        PROJECT_DIR=$(find maya-source -name settings.gradle -printf '%h\n' | head -n 1)
      fi
      if [ -z "$PROJECT_DIR" ]; then
        echo "Could not find settings.gradle or settings.gradle.kts"
        find maya-source -maxdepth 4 -type f | head -100
        exit 1
      fi
      echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      echo "Found project at $PROJECT_DIR"

  - name: Build debug APK
    run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

  - name: Upload Maya APK
    uses: actions/upload-artifact@v4
    with:
      name: Maya-debug-APK
      path: maya-source/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
