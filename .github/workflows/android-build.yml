name: Maya APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Maya APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Maya project ZIP
        shell: bash
        run: |
          if [ ! -f "MayaAndroidProject.zip" ]; then
            echo "ERROR: MayaAndroidProject.zip is missing."
            exit 1
          fi
          echo "Maya project ZIP found."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Maya project
        shell: bash
        run: |
          mkdir -p maya-source
          unzip -o MayaAndroidProject.zip -d maya-source

      # FIXED: Now looks for .kts files and doesn't crash if empty
      - name: Fix Java Version Mismatch
        shell: bash
        run: |
          echo "Patching Gradle files to match Java 17..."
          # Look for build.gradle AND build.gradle.kts
          # Use xargs -r to avoid 'no input files' error
          find maya-source -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | xargs -0 -r sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g'
          find maya-source -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | xargs -0 -r sed -i "s/jvmTarget = ['\"]1.8['\"]/jvmTarget = '17'/g"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""
          # Updated to check for .kts files first
          for FILE in settings.gradle.kts settings.gradle; do
            PROJECT_DIR="$(find maya-source -type f -name "$FILE" -print -quit)"
            if [ -n "$PROJECT_DIR" ]; then
              PROJECT_DIR="$(dirname "$PROJECT_DIR")"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found."
            ls -R maya-source
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Build Maya debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload Maya APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-debug-APK
          path: |
            maya-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
