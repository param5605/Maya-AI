name: Maya APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Maya APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Maya project ZIP
        shell: bash
        run: |
          if [ -f "MayaAndroidProject_CORE_JVM17_FIXED.zip" ]; then
            echo "MAYA_ZIP=MayaAndroidProject_CORE_JVM17_FIXED.zip" >> "$GITHUB_ENV"
          elif [ -f "MayaAndroidProject_JVM17_FIXED.zip" ]; then
            echo "MAYA_ZIP=MayaAndroidProject_JVM17_FIXED.zip" >> "$GITHUB_ENV"
          elif [ -f "MayaAndroidProject_FIXED.zip" ]; then
            echo "MAYA_ZIP=MayaAndroidProject_FIXED.zip" >> "$GITHUB_ENV"
          elif [ -f "MayaAndroidProject.zip" ]; then
            echo "MAYA_ZIP=MayaAndroidProject.zip" >> "$GITHUB_ENV"
          else
            echo "ERROR: No Maya project ZIP found in the repository root."
            exit 1
          fi

          echo "Selected project: $MAYA_ZIP"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Maya project
        run: |
          mkdir -p maya-project
          unzip -q "$MAYA_ZIP" -d maya-project
          echo "Project files:"
          find maya-project -maxdepth 4 -type f | sort | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          PROJECT_DIR="$(find maya-project -name settings.gradle.kts -type f -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Could not find settings.gradle.kts and gradlew together."
            echo "The ZIP must contain the Gradle wrapper."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload Maya APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-APK
          path: maya-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
