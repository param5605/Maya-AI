name: Maya APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Maya APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Maya project ZIP
        shell: bash
        run: |
          if [ -f "MayaAndroidProject_CORE_JVM17_FIXED.zip" ]; then
            echo "MAYA_ZIP=MayaAndroidProject_CORE_JVM17_FIXED.zip" >> "$GITHUB_ENV"
          elif [ -f "MayaAndroidProject_JVM17_FIXED.zip" ]; then
            echo "MAYA_ZIP=MayaAndroidProject_JVM17_FIXED.zip" >> "$GITHUB_ENV"
          elif [ -f "MayaAndroidProject_FIXED.zip" ]; then
            echo "MAYA_ZIP=MayaAndroidProject_FIXED.zip" >> "$GITHUB_ENV"
          elif [ -f "MayaAndroidProject.zip" ]; then
            echo "MAYA_ZIP=MayaAndroidProject.zip" >> "$GITHUB_ENV"
          else
            echo "ERROR: Maya project ZIP not found."
            exit 1
          fi

          echo "Selected ZIP: $MAYA_ZIP"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Maya project
        run: |
          mkdir -p maya-project
          unzip -q "$MAYA_ZIP" -d maya-project
          echo "Extracted project files:"
          find maya-project -maxdepth 5 -type f | sort | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          SETTINGS_FILE="$(find maya-project -name settings.gradle.kts -type f -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper is missing. Installing Gradle to generate it."

            sudo apt-get update
            sudo apt-get install -y gradle

            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload Maya APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-APK
          path: maya-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
